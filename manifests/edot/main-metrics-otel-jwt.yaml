apiVersion: v1
kind: ConfigMap
metadata:
  name: edot-main-metrics-jwt-config
  namespace: lab-main
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 127.0.0.1:4318

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
      attributes/edot_jwt_metrics:
        actions:
          - key: data_stream.type
            value: metrics
            action: upsert
          - key: data_stream.dataset
            value: elasticsearch.stack_monitoring
            action: upsert
          - key: data_stream.namespace
            value: main
            action: upsert
          - key: service.name
            value: elasticsearch-main
            action: upsert
          - key: service.namespace
            value: lab-main
            action: upsert
      resource/main:
        attributes:
          - key: orchestrator.cluster.name
            value: edot-lab
            action: upsert
      batch:
        send_batch_size: 1024
        send_batch_max_size: 2048
        timeout: 5s

    exporters:
      otlp_grpc/gateway:
        endpoint: edot-gateway.lab-monitoring.svc.cluster.local:4317
        tls:
          insecure: true

    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, attributes/edot_jwt_metrics, resource/main, batch]
          exporters: [otlp_grpc/gateway]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edot-main-metrics-jwt-exporter
  namespace: lab-main
data:
  exporter.py: |
    import json
    import os
    import ssl
    import threading
    import time
    import urllib.error
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    from opentelemetry import metrics
    from opentelemetry.exporter.otlp.proto.http.metric_exporter import OTLPMetricExporter
    from opentelemetry.sdk.metrics import MeterProvider
    from opentelemetry.sdk.metrics.export import PeriodicExportingMetricReader
    from opentelemetry.sdk.resources import Resource

    UPSTREAM_ES_URL = os.environ["UPSTREAM_ES_URL"].rstrip("/")
    JWT_SHARED_SECRET = os.environ["JWT_SHARED_SECRET"]
    JWT_TOKEN_FILE = os.environ.get("JWT_TOKEN_FILE", "/jwt/token")
    UPSTREAM_CA_FILE = os.environ.get("UPSTREAM_CA_FILE", "/etc/otel/certs/ca.crt")
    HEALTH_PORT = int(os.environ.get("HEALTH_PORT", "9100"))
    POLL_INTERVAL = int(os.environ.get("POLL_INTERVAL", "10"))
    TARGET_CLUSTER = os.environ.get("TARGET_CLUSTER_NAME", "edot-lab")
    OTLP_ENDPOINT = os.environ.get("OTLP_ENDPOINT", "http://127.0.0.1:4318/v1/metrics")

    STATE = {
        "cluster": {},
        "nodes": [],
        "indices": [],
        "updated_at": 0,
        "error": "",
        "up": 0,
    }
    LOCK = threading.Lock()
    SSL_CTX = ssl.create_default_context(cafile=UPSTREAM_CA_FILE)

    def read_token():
        with open(JWT_TOKEN_FILE, "r", encoding="utf-8") as fh:
            return fh.read().strip()

    def fetch_json(path):
        req = urllib.request.Request(f"{UPSTREAM_ES_URL}{path}")
        req.add_header("Authorization", f"Bearer {read_token()}")
        req.add_header("ES-Client-Authentication", f"SharedSecret {JWT_SHARED_SECRET}")
        with urllib.request.urlopen(req, context=SSL_CTX, timeout=30) as resp:
            return json.load(resp)

    def safe_get(dct, *path, default=None):
        cur = dct
        for key in path:
            if not isinstance(cur, dict) or key not in cur:
                return default
            cur = cur[key]
        return cur

    def snapshot():
        cluster_health = fetch_json("/_cluster/health")
        cluster_stats = fetch_json("/_cluster/stats")
        pending_tasks = fetch_json("/_cluster/pending_tasks")
        nodes_stats = fetch_json("/_nodes/stats/jvm,process,indices,thread_pool,fs,breaker")
        indices_stats = fetch_json("/_stats/docs,store,segments,indexing,search")
        cat_indices = fetch_json("/_cat/indices?format=json&expand_wildcards=all")

        cluster_name = cluster_health.get("cluster_name") or safe_get(cluster_stats, "cluster_name", default=TARGET_CLUSTER)

        cluster = {
            "cluster_name": cluster_name,
            "status": cluster_health.get("status", "unknown"),
            "nodes_total": safe_get(cluster_stats, "nodes", "count", "total", default=0),
            "nodes_data": safe_get(cluster_stats, "nodes", "count", "data", default=0),
            "indices_total": safe_get(cluster_stats, "indices", "count", default=0),
            "shards_total": safe_get(cluster_stats, "indices", "shards", "total", default=safe_get(cluster_stats, "indices", "shards", "count", default=0)),
            "shards_primaries": safe_get(cluster_stats, "indices", "shards", "primaries", default=0),
            "docs_total": safe_get(cluster_stats, "indices", "docs", "count", default=0),
            "store_size_bytes": safe_get(cluster_stats, "indices", "store", "size_in_bytes", default=0),
            "pending_tasks_total": len(pending_tasks.get("tasks", [])),
        }

        nodes = []
        for node_id, node in (nodes_stats.get("nodes") or {}).items():
            nodes.append({
                "cluster_name": cluster_name,
                "node_id": node_id,
                "node_name": node.get("name") or node_id,
                "heap_used_bytes": safe_get(node, "jvm", "mem", "heap_used_in_bytes", default=0),
                "heap_max_bytes": safe_get(node, "jvm", "mem", "heap_max_in_bytes", default=0),
                "heap_used_pct": safe_get(node, "jvm", "mem", "heap_used_percent", default=0),
                "cpu_pct": safe_get(node, "process", "cpu", "percent", default=0),
                "open_file_descriptors": safe_get(node, "process", "open_file_descriptors", default=0),
                "search_queue": safe_get(node, "thread_pool", "search", "queue", default=0),
                "write_queue": safe_get(node, "thread_pool", "write", "queue", default=0),
                "search_rejected_total": safe_get(node, "thread_pool", "search", "rejected", default=0),
                "write_rejected_total": safe_get(node, "thread_pool", "write", "rejected", default=0),
                "young_gc_time_ms": safe_get(node, "jvm", "gc", "collectors", "young", "collection_time_in_millis", default=0),
                "old_gc_time_ms": safe_get(node, "jvm", "gc", "collectors", "old", "collection_time_in_millis", default=0),
                "search_total": safe_get(node, "indices", "search", "query_total", default=0),
                "indexing_total": safe_get(node, "indices", "indexing", "index_total", default=0),
                "store_size_bytes": safe_get(node, "indices", "store", "size_in_bytes", default=0),
                "segments_count": safe_get(node, "indices", "segments", "count", default=0),
                "request_breakers_total": safe_get(node, "breakers", "request", "tripped", default=0),
                "parent_breakers_total": safe_get(node, "breakers", "parent", "tripped", default=0),
                "ingest_failures_total": safe_get(node, "indices", "ingest", "failed_count", default=0),
            })

        indices = []
        for index_name, index_doc in (indices_stats.get("indices") or {}).items():
            total = index_doc.get("total", {})
            primaries = index_doc.get("primaries", {})
            cat_index = next((row for row in cat_indices if row.get("index") == index_name), {})
            indices.append({
                "cluster_name": cluster_name,
                "index_name": index_name,
                "status": cat_index.get("status", "open"),
                "docs_total": safe_get(total, "docs", "count", default=0),
                "store_size_bytes": safe_get(total, "store", "size_in_bytes", default=0),
                "segments_count": safe_get(total, "segments", "count", default=0),
                "search_query_total": safe_get(total, "search", "query_total", default=0),
                "indexing_total": safe_get(total, "indexing", "index_total", default=0),
                "primary_shards": int(safe_get(primaries, "shards", "total", default=cat_index.get("pri") or 0) or 0),
                "total_shards": int(cat_index.get("pri", 0) or 0) + int(cat_index.get("rep", 0) or 0),
            })

        return {"cluster": cluster, "nodes": nodes, "indices": indices}

    def metric_labels(**kwargs):
        return {k: str(v) for k, v in kwargs.items() if v is not None}

    def cluster_health_cb(_options):
        with LOCK:
            cluster = dict(STATE["cluster"])
        status = cluster.get("status", "unknown")
        cluster_name = cluster.get("cluster_name", TARGET_CLUSTER)
        return [
            metrics.Observation(1 if status == state else 0, metric_labels(cluster_name=cluster_name, state=state))
            for state in ("green", "yellow", "red")
        ]

    def _num(v, default=0):
        try:
            return int(v) if v is not None else default
        except (TypeError, ValueError):
            return default

    def scalar_cluster_cb(field):
        def _cb(_options):
            with LOCK:
                cluster = dict(STATE["cluster"])
            return [metrics.Observation(_num(cluster.get(field, 0)), metric_labels(cluster_name=cluster.get("cluster_name", TARGET_CLUSTER)))]
        return _cb

    def node_metric_cb(field):
        def _cb(_options):
            with LOCK:
                nodes = list(STATE["nodes"])
            obs = []
            for node in nodes:
                obs.append(metrics.Observation(_num(node.get(field, 0)), metric_labels(
                    cluster_name=node.get("cluster_name", TARGET_CLUSTER),
                    node_name=node.get("node_name"),
                    node_id=node.get("node_id"),
                )))
            return obs
        return _cb

    def index_metric_cb(field):
        def _cb(_options):
            with LOCK:
                indices = list(STATE["indices"])
            obs = []
            for index in indices:
                obs.append(metrics.Observation(_num(index.get(field, 0)), metric_labels(
                    cluster_name=index.get("cluster_name", TARGET_CLUSTER),
                    index_name=index.get("index_name"),
                    status=index.get("status"),
                )))
            return obs
        return _cb

    def register_gauge(name, callback, description, unit="1"):
        meter.create_observable_gauge(name, callbacks=[callback], description=description, unit=unit)

    def poll_loop():
        while True:
            try:
                snap = snapshot()
                with LOCK:
                    STATE["cluster"] = snap["cluster"]
                    STATE["nodes"] = snap["nodes"]
                    STATE["indices"] = snap["indices"]
                    STATE["updated_at"] = int(time.time())
                    STATE["error"] = ""
                    STATE["up"] = 1
            except Exception as exc:
                with LOCK:
                    STATE["error"] = str(exc)
                    STATE["up"] = 0
            time.sleep(POLL_INTERVAL)

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path not in {"/", "/health"}:
                self.send_response(404)
                self.end_headers()
                return
            with LOCK:
                body = json.dumps({
                    "up": STATE["up"],
                    "updated_at": STATE["updated_at"],
                    "error": STATE["error"],
                }).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, fmt, *args):
            print(f"jwt-metrics-exporter {self.address_string()} {fmt % args}", flush=True)

    resource = Resource.create({
        "service.name": "elasticsearch-jwt-exporter",
        "service.namespace": "lab-main",
        "orchestrator.cluster.name": TARGET_CLUSTER,
        "data_stream.type": "metrics",
        "data_stream.dataset": "elasticsearch.stack_monitoring",
        "data_stream.namespace": "main",
    })
    reader = PeriodicExportingMetricReader(
        OTLPMetricExporter(endpoint=OTLP_ENDPOINT),
        export_interval_millis=POLL_INTERVAL * 1000,
    )
    provider = MeterProvider(resource=resource, metric_readers=[reader])
    metrics.set_meter_provider(provider)
    meter = metrics.get_meter("elasticsearch-jwt-exporter")

    register_gauge("elasticsearch_cluster_health_state", cluster_health_cb, "Cluster health state, 1 when active.")
    for field, name, unit, desc in [
        ("nodes_total", "elasticsearch_cluster_nodes_total", "1", "Number of Elasticsearch nodes in the cluster."),
        ("nodes_data", "elasticsearch_cluster_nodes_data", "1", "Number of data nodes in the cluster."),
        ("indices_total", "elasticsearch_cluster_indices_total", "1", "Number of indices in the cluster."),
        ("shards_total", "elasticsearch_cluster_shards_total", "1", "Number of total shards in the cluster."),
        ("shards_primaries", "elasticsearch_cluster_shards_primaries", "1", "Number of primary shards in the cluster."),
        ("docs_total", "elasticsearch_cluster_docs_total", "1", "Number of indexed documents in the cluster."),
        ("store_size_bytes", "elasticsearch_cluster_store_size_bytes", "By", "Cluster store size in bytes."),
        ("pending_tasks_total", "elasticsearch_cluster_pending_tasks_total", "1", "Number of pending tasks."),
    ]:
        register_gauge(name, scalar_cluster_cb(field), desc, unit=unit)

    for field, name, unit, desc in [
        ("heap_used_bytes", "elasticsearch_node_heap_used_bytes", "By", "Node heap used in bytes."),
        ("heap_max_bytes", "elasticsearch_node_heap_max_bytes", "By", "Node heap max in bytes."),
        ("heap_used_pct", "elasticsearch_node_heap_used_pct", "1", "Node heap used percent."),
        ("cpu_pct", "elasticsearch_node_cpu_pct", "1", "Node CPU percent."),
        ("open_file_descriptors", "elasticsearch_node_open_file_descriptors", "1", "Node open file descriptors."),
        ("search_queue", "elasticsearch_node_search_queue", "1", "Node search queue size."),
        ("write_queue", "elasticsearch_node_write_queue", "1", "Node write queue size."),
        ("search_rejected_total", "elasticsearch_node_search_rejected_total", "1", "Node search rejections."),
        ("write_rejected_total", "elasticsearch_node_write_rejected_total", "1", "Node write rejections."),
        ("young_gc_time_ms", "elasticsearch_node_young_gc_time_ms", "ms", "Node young GC collection time in ms."),
        ("old_gc_time_ms", "elasticsearch_node_old_gc_time_ms", "ms", "Node old GC collection time in ms."),
        ("search_total", "elasticsearch_node_search_total", "1", "Node search query total."),
        ("indexing_total", "elasticsearch_node_indexing_total", "1", "Node indexing total."),
        ("store_size_bytes", "elasticsearch_node_store_size_bytes", "By", "Node store size in bytes."),
        ("segments_count", "elasticsearch_node_segments_count", "1", "Node segments count."),
        ("request_breakers_total", "elasticsearch_node_request_breakers_total", "1", "Node request breaker trips."),
        ("parent_breakers_total", "elasticsearch_node_parent_breakers_total", "1", "Node parent breaker trips."),
        ("ingest_failures_total", "elasticsearch_node_ingest_failures_total", "1", "Node ingest failures."),
    ]:
        register_gauge(name, node_metric_cb(field), desc, unit=unit)

    for field, name, unit, desc in [
        ("docs_total", "elasticsearch_index_docs", "1", "Index document count."),
        ("store_size_bytes", "elasticsearch_index_store_size_bytes", "By", "Index store size in bytes."),
        ("segments_count", "elasticsearch_index_segments_count", "1", "Index segments count."),
        ("search_query_total", "elasticsearch_index_search_query_total", "1", "Index query total."),
        ("indexing_total", "elasticsearch_index_indexing_total", "1", "Index indexing total."),
        ("primary_shards", "elasticsearch_index_primary_shards", "1", "Index primary shards."),
        ("total_shards", "elasticsearch_index_total_shards", "1", "Index total shards."),
    ]:
        register_gauge(name, index_metric_cb(field), desc, unit=unit)

    threading.Thread(target=poll_loop, daemon=True).start()
    ThreadingHTTPServer(("0.0.0.0", HEALTH_PORT), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edot-main-metrics-jwt
  namespace: lab-main
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edot-main-metrics-jwt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edot-main-metrics-jwt
    spec:
      initContainers:
        - name: mint-jwt
          image: python:3.11-slim
          command:
            - python3
            - -c
            - |
              import base64, hashlib, hmac, json, os, secrets, time

              key_b64   = os.environ['JWT_KEY_B64']
              issuer    = os.environ['JWT_ISSUER']
              audience  = os.environ['JWT_AUDIENCE']
              principal = os.environ['JWT_PRINCIPAL']
              kid       = os.environ['JWT_KEY_ID']

              def b64url(data):
                  return base64.urlsafe_b64encode(data).decode().rstrip('=')
              def decode_b64url(v):
                  return base64.urlsafe_b64decode(v + '=' * (-len(v) % 4))

              now = int(time.time())
              header  = {'alg': 'HS256', 'typ': 'JWT', 'kid': kid}
              payload = {
                  'iss': issuer,  'aud': audience, 'sub': principal,
                  'iat': now,     'nbf': now - 5,  'exp': now + 86400,
                  'jti': secrets.token_urlsafe(18),
              }
              si = (
                  b64url(json.dumps(header,  separators=(',', ':')).encode()) + '.' +
                  b64url(json.dumps(payload, separators=(',', ':')).encode())
              )
              sig   = hmac.new(decode_b64url(key_b64), si.encode(), hashlib.sha256).digest()
              token = f'{si}.{b64url(sig)}'
              with open('/jwt/token', 'w') as fh:
                  fh.write(token)
              print(f'JWT minted: sub={principal}, exp=+86400s (24h)', flush=True)
          envFrom:
            - secretRef:
                name: agent-jwt-mint-credentials
          volumeMounts:
            - name: jwt-tokens
              mountPath: /jwt
      containers:
        - name: edot-main-metrics-jwt
          image: docker.elastic.co/elastic-agent/elastic-otel-collector-wolfi:__ELASTIC_AGENT_VERSION__
          command:
            - /bin/bash
            - -c
            - |
              /usr/share/elastic-agent/otelcol --config /etc/otel/config.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/otel/config.yaml
              subPath: config.yaml
            - name: jwt-tokens
              mountPath: /jwt
              readOnly: true
          ports:
            - containerPort: 13133
              name: health
          readinessProbe:
            httpGet:
              path: /
              port: 13133
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
        - name: jwt-metrics-exporter
          image: python:3.11-slim
          command:
            - /bin/sh
            - -ec
            - |
              python3 -m pip install --no-cache-dir opentelemetry-sdk opentelemetry-exporter-otlp-proto-http
              exec python3 /opt/jwt-exporter/exporter.py
          env:
            - name: UPSTREAM_ES_URL
              valueFrom:
                secretKeyRef:
                  name: edot-main-source-credentials
                  key: main-elasticsearch-url
            - name: JWT_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: agent-jwt-mint-credentials
                  key: JWT_SHARED_SECRET
            - name: JWT_TOKEN_FILE
              value: /jwt/token
            - name: UPSTREAM_CA_FILE
              value: /etc/otel/certs/ca.crt
            - name: LISTEN_PORT
              value: "9100"
            - name: POLL_INTERVAL
              value: "10"
            - name: TARGET_CLUSTER_NAME
              value: edot-lab
          ports:
            - containerPort: 9100
              name: metrics
          readinessProbe:
            httpGet:
              path: /health
              port: 9100
          volumeMounts:
            - name: root-ca
              mountPath: /etc/otel/certs
              readOnly: true
            - name: jwt-tokens
              mountPath: /jwt
              readOnly: true
            - name: exporter
              mountPath: /opt/jwt-exporter
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 192Mi
        - name: jwt-source-proxy
          image: python:3.11-slim
          command:
            - python3
            - -u
            - -c
            - |
              import http.server
              import os
              import ssl
              import urllib.error
              import urllib.request

              upstream = os.environ["UPSTREAM_ES_URL"].rstrip("/")
              secret = os.environ["JWT_SHARED_SECRET"]
              token_path = os.environ.get("JWT_TOKEN_FILE", "/jwt/token")
              ctx = ssl.create_default_context(cafile=os.environ.get("UPSTREAM_CA_FILE", "/etc/otel/certs/ca.crt"))

              def read_token():
                  with open(token_path, "r", encoding="utf-8") as fh:
                      return fh.read().strip()

              class Handler(http.server.BaseHTTPRequestHandler):
                  protocol_version = "HTTP/1.1"

                  def _proxy(self):
                      length = int(self.headers.get("Content-Length", "0") or "0")
                      body = self.rfile.read(length) if length > 0 else None
                      req = urllib.request.Request(f"{upstream}{self.path}", data=body, method=self.command)
                      req.add_header("Authorization", f"Bearer {read_token()}")
                      req.add_header("ES-Client-Authentication", f"SharedSecret {secret}")
                      for key, value in self.headers.items():
                          lk = key.lower()
                          if lk in {"host", "content-length", "connection", "authorization", "es-client-authentication"}:
                              continue
                          req.add_header(key, value)
                      try:
                          with urllib.request.urlopen(req, context=ctx, timeout=60) as resp:
                              payload = resp.read()
                              self.send_response(resp.status)
                              for key, value in resp.headers.items():
                                  if key.lower() in {"transfer-encoding", "content-length", "connection", "keep-alive"}:
                                      continue
                                  self.send_header(key, value)
                              self.send_header("Content-Length", str(len(payload)))
                              self.end_headers()
                              self.wfile.write(payload)
                      except urllib.error.HTTPError as exc:
                          payload = exc.read()
                          self.send_response(exc.code)
                          for key, value in exc.headers.items():
                              if key.lower() in {"transfer-encoding", "content-length", "connection", "keep-alive"}:
                                  continue
                              self.send_header(key, value)
                          self.send_header("Content-Length", str(len(payload)))
                          self.end_headers()
                          self.wfile.write(payload)

                  def do_GET(self): self._proxy()
                  def do_POST(self): self._proxy()
                  def do_PUT(self): self._proxy()
                  def do_DELETE(self): self._proxy()
                  def do_HEAD(self): self._proxy()

                  def log_message(self, fmt, *args):
                      print(f"jwt-source-proxy {self.address_string()} {fmt % args}", flush=True)

              http.server.ThreadingHTTPServer(("0.0.0.0", int(os.environ.get("LISTEN_PORT", "19200"))), Handler).serve_forever()
          env:
            - name: UPSTREAM_ES_URL
              valueFrom:
                secretKeyRef:
                  name: edot-main-source-credentials
                  key: main-elasticsearch-url
            - name: JWT_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: agent-jwt-mint-credentials
                  key: JWT_SHARED_SECRET
            - name: UPSTREAM_CA_FILE
              value: /etc/otel/certs/ca.crt
            - name: JWT_TOKEN_FILE
              value: /jwt/token
            - name: LISTEN_PORT
              value: "19200"
          volumeMounts:
            - name: root-ca
              mountPath: /etc/otel/certs
              readOnly: true
            - name: jwt-tokens
              mountPath: /jwt
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
        - name: token-refresher
          image: python:3.11-slim
          command:
            - python3
            - -c
            - |
              import base64, hashlib, hmac, json, os, secrets, time

              key_b64   = os.environ['JWT_KEY_B64']
              issuer    = os.environ['JWT_ISSUER']
              audience  = os.environ['JWT_AUDIENCE']
              principal = os.environ['JWT_PRINCIPAL']
              kid       = os.environ['JWT_KEY_ID']

              def b64url(data):
                  return base64.urlsafe_b64encode(data).decode().rstrip('=')
              def decode_b64url(v):
                  return base64.urlsafe_b64decode(v + '=' * (-len(v) % 4))

              def mint():
                  now = int(time.time())
                  h = {'alg': 'HS256', 'typ': 'JWT', 'kid': kid}
                  p = {
                      'iss': issuer,  'aud': audience, 'sub': principal,
                      'iat': now,     'nbf': now - 5,  'exp': now + 86400,
                      'jti': secrets.token_urlsafe(18),
                  }
                  si = (b64url(json.dumps(h, separators=(',', ':')).encode()) + '.' +
                        b64url(json.dumps(p, separators=(',', ':')).encode()))
                  sig = hmac.new(decode_b64url(key_b64), si.encode(), hashlib.sha256).digest()
                  return f'{si}.{b64url(sig)}'

              while True:
                  time.sleep(82800)
                  try:
                      token = mint()
                      with open('/jwt/token', 'w') as fh:
                          fh.write(token)
                      ts = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
                      print(f'JWT refreshed at {ts} (valid 24h)', flush=True)
                  except Exception as exc:
                      print(f'JWT refresh error: {exc}', flush=True)
          envFrom:
            - secretRef:
                name: agent-jwt-mint-credentials
          volumeMounts:
            - name: jwt-tokens
              mountPath: /jwt
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: edot-main-metrics-jwt-config
        - name: exporter
          configMap:
            name: edot-main-metrics-jwt-exporter
        - name: root-ca
          secret:
            secretName: edot-root-ca
        - name: jwt-tokens
          emptyDir: {}
