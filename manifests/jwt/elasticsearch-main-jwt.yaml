apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch-main
  namespace: lab-main
spec:
  version: __ES_VERSION__
  http:
    tls:
      certificate:
        secretName: es-main-tls
  secureSettings:
    - secretName: elasticsearch-main-jwt-secure-settings
  nodeSets:
    - name: default
      count: __MAIN_ES_NODES__
      config:
        node.store.allow_mmap: false
        xpack.security.authc.realms.jwt.__JWT_TEST_REALM_NAME__.order: 3
        xpack.security.authc.realms.jwt.__JWT_TEST_REALM_NAME__.token_type: access_token
        xpack.security.authc.realms.jwt.__JWT_TEST_REALM_NAME__.client_authentication.type: shared_secret
        xpack.security.authc.realms.jwt.__JWT_TEST_REALM_NAME__.allowed_issuer: __JWT_TEST_ISSUER__
        xpack.security.authc.realms.jwt.__JWT_TEST_REALM_NAME__.allowed_audiences: [ "__JWT_TEST_AUDIENCE__" ]
        xpack.security.authc.realms.jwt.__JWT_TEST_REALM_NAME__.allowed_signature_algorithms: [HS256]
        xpack.security.authc.realms.jwt.__JWT_TEST_REALM_NAME__.allowed_subjects: [ "__JWT_TEST_PRINCIPAL__" ]
        xpack.security.authc.realms.jwt.__JWT_TEST_REALM_NAME__.claims.principal: sub
        xpack.security.authc.realms.jwt.__JWT_TEST_REALM_NAME__.claims.groups: groups
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              resources:
                requests:
                  cpu: "__MAIN_ES_CPU__"
                  memory: __MAIN_ES_MEMORY__
                limits:
                  memory: __MAIN_ES_MEMORY__
---
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana-main
  namespace: lab-main
spec:
  version: __ES_VERSION__
  count: 1
  elasticsearchRef:
    name: elasticsearch-main
  http:
    tls:
      certificate:
        secretName: es-main-tls
